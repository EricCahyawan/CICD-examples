# GitHub Actions Workflow untuk Continuous Deployment
# File ini mendefinisikan pipeline CD untuk deployment otomatis

name: CD Pipeline

# Trigger: berjalan saat ada release atau tag baru
on:
  # Berjalan saat membuat release
  release:
    types: [published]
  
  # Berjalan saat push tag yang dimulai dengan 'v'
  push:
    tags:
      - 'v*'
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

# Environment variables
env:
  PYTHON_VERSION: '3.10'

jobs:
  # Job 1: Deploy ke Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run pre-deployment tests
      run: |
        pytest tests/ --verbose
    
    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        echo "✅ Application deployed successfully to staging!"
        echo "📍 Staging URL: https://staging.calculator-app.com"
    
    - name: Run smoke tests
      run: |
        echo "🧪 Running smoke tests on staging..."
        python src/calculator.py
        echo "✅ Smoke tests passed!"
    
    - name: Notify deployment
      run: |
        echo "📢 Staging deployment completed successfully!"

  # Job 2: Deploy ke Production (hanya untuk release)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-staging
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Final security check
      run: |
        pip install bandit
        bandit -r src/
    
    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment..."
        echo "⚠️  Production deployment requires manual approval"
        echo "✅ Application deployed successfully to production!"
        echo "📍 Production URL: https://calculator-app.com"
    
    - name: Run production smoke tests
      run: |
        echo "🧪 Running production smoke tests..."
        python src/calculator.py
        echo "✅ Production smoke tests passed!"
    
    - name: Create deployment record
      run: |
        echo "📝 Creating deployment record..."
        echo "Deployment Date: $(date)"
        echo "Version: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
    
    - name: Notify production deployment
      run: |
        echo "🎉 Production deployment completed successfully!"
        echo "🔗 Application is live at: https://calculator-app.com"