# Advanced CI Pipeline dengan fitur tambahan
# Demonstrasi advanced features untuk pembelajaran

name: Advanced CI Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Jalankan setiap hari jam 2 pagi UTC (nightly build)
    - cron: '0 2 * * *'

env:
  PYTHON_DEFAULT_VERSION: '3.10'

jobs:
  # Job 1: Code Quality dan Static Analysis
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Fetch full history untuk better analysis
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
    
    - name: Install analysis tools
      run: |
        pip install --upgrade pip
        pip install flake8 black isort mypy bandit safety
        pip install -r requirements.txt
    
    - name: Run import sorting check
      run: |
        isort --check-only --diff .
    
    - name: Run type checking with mypy
      run: |
        mypy src/ --ignore-missing-imports || true
    
    - name: Run comprehensive linting
      run: |
        flake8 . --count --statistics --tee --output-file=flake8-report.txt
    
    - name: Advanced security analysis
      run: |
        bandit -r src/ -f json -o bandit-report.json
        safety check --json --output safety-report.json
    
    - name: Upload analysis reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: code-analysis-reports
        path: |
          flake8-report.txt
          bandit-report.json
          safety-report.json

  # Job 2: Comprehensive Testing
  comprehensive-test:
    name: Comprehensive Testing
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']
        exclude:
          # Skip beberapa kombinasi untuk menghemat resources
          - os: macos-latest
            python-version: '3.8'
          - os: windows-latest
            python-version: '3.8'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests with detailed output
      run: |
        pytest tests/ \
          --verbose \
          --cov=src \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --junit-xml=pytest-results.xml
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          pytest-results.xml
          htmlcov/
          coverage.xml

  # Job 3: Performance Testing
  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: comprehensive-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest-benchmark memory-profiler
    
    - name: Run performance benchmarks
      run: |
        python -c "
        import time
        from src.calculator import Calculator
        
        calc = Calculator()
        
        # Benchmark basic operations
        start_time = time.time()
        for i in range(10000):
            calc.add(i, i+1)
            calc.multiply(i, 2)
            calc.divide(i+1, 2) if i > 0 else None
        end_time = time.time()
        
        print(f'Performance Test: 10,000 operations completed in {end_time - start_time:.4f} seconds')
        
        # Memory usage test
        import tracemalloc
        tracemalloc.start()
        
        results = []
        for i in range(1000):
            results.append(calc.power(2, 10))
        
        current, peak = tracemalloc.get_traced_memory()
        tracemalloc.stop()
        
        print(f'Memory usage: Current={current/1024/1024:.2f}MB, Peak={peak/1024/1024:.2f}MB')
        "

  # Job 4: Integration Testing
  integration-test:
    name: Integration Testing
    runs-on: ubuntu-latest
    needs: comprehensive-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run integration tests
      run: |
        python -c "
        # Integration test: Test calculator sebagai complete system
        from src.calculator import Calculator
        import sys
        
        def integration_test():
            calc = Calculator()
            
            # Test scenario: Complex calculation
            try:
                # (5 + 3) * 2 / 4 - 1 = 3
                step1 = calc.add(5, 3)        # 8
                step2 = calc.multiply(step1, 2) # 16
                step3 = calc.divide(step2, 4)   # 4
                result = calc.subtract(step3, 1) # 3
                
                assert result == 3, f'Expected 3, got {result}'
                print('✅ Integration Test 1: Complex calculation - PASSED')
                
                # Test error handling integration
                try:
                    calc.divide(10, 0)
                    assert False, 'Should have raised ValueError'
                except ValueError:
                    print('✅ Integration Test 2: Error handling - PASSED')
                
                # Test all functions work together
                operations = [
                    calc.add(1, 2),
                    calc.subtract(5, 2),
                    calc.multiply(3, 4),
                    calc.divide(10, 2),
                    calc.power(2, 3)
                ]
                
                expected = [3, 3, 12, 5.0, 8]
                assert operations == expected, f'Expected {expected}, got {operations}'
                print('✅ Integration Test 3: All operations - PASSED')
                
                return True
                
            except Exception as e:
                print(f'❌ Integration test failed: {e}')
                return False
        
        success = integration_test()
        sys.exit(0 if success else 1)
        "

  # Job 5: Documentation dan Compliance Check
  documentation-check:
    name: Documentation & Compliance
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check documentation completeness
      run: |
        echo "📚 Checking documentation..."
        
        # Check README exists dan tidak kosong
        if [ ! -f "README.md" ] || [ ! -s "README.md" ]; then
          echo "❌ README.md missing or empty"
          exit 1
        fi
        echo "✅ README.md exists"
        
        # Check docstrings di Python files
        python -c "
        import ast
        import sys
        
        def check_docstrings(filename):
            with open(filename, 'r') as f:
                tree = ast.parse(f.read())
            
            functions = [node for node in ast.walk(tree) if isinstance(node, ast.FunctionDef)]
            classes = [node for node in ast.walk(tree) if isinstance(node, ast.ClassDef)]
            
            missing_docs = []
            
            for func in functions:
                if not ast.get_docstring(func) and not func.name.startswith('_'):
                    missing_docs.append(f'Function: {func.name}')
            
            for cls in classes:
                if not ast.get_docstring(cls):
                    missing_docs.append(f'Class: {cls.name}')
            
            return missing_docs
        
        # Check main source files
        files_to_check = ['src/calculator.py']
        all_missing = []
        
        for file in files_to_check:
            missing = check_docstrings(file)
            if missing:
                all_missing.extend([f'{file}: {item}' for item in missing])
        
        if all_missing:
            print('❌ Missing docstrings:')
            for item in all_missing:
                print(f'  - {item}')
            sys.exit(1)
        else:
            print('✅ All functions dan classes have docstrings')
        "
    
    - name: License compliance check
      run: |
        echo "⚖️ Checking license compliance..."
        # Dalam real project, ini bisa check license headers, dependencies, etc.
        echo "✅ License compliance check passed"

  # Job 6: Build dan Package Validation
  build-validation:
    name: Build & Package Validation
    runs-on: ubuntu-latest
    needs: [code-quality, comprehensive-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
    
    - name: Install build tools
      run: |
        pip install build twine wheel
    
    - name: Build package
      run: |
        python -m build
    
    - name: Validate package
      run: |
        twine check dist/*
    
    - name: Test package installation
      run: |
        pip install dist/*.whl
        python -c "from src.calculator import Calculator; print('✅ Package installation successful')"
    
    - name: Upload package artifacts
      uses: actions/upload-artifact@v3
      with:
        name: python-package
        path: dist/

  # Job 7: Notification dan Reporting
  notification:
    name: Build Notification
    runs-on: ubuntu-latest
    needs: [code-quality, comprehensive-test, performance-test, integration-test, documentation-check, build-validation]
    if: always()
    
    steps:
    - name: Determine overall status
      id: status
      run: |
        # Check if any job failed
        if [[ "${{ needs.code-quality.result }}" == "failure" || 
              "${{ needs.comprehensive-test.result }}" == "failure" || 
              "${{ needs.performance-test.result }}" == "failure" || 
              "${{ needs.integration-test.result }}" == "failure" || 
              "${{ needs.documentation-check.result }}" == "failure" || 
              "${{ needs.build-validation.result }}" == "failure" ]]; then
          echo "status=failure" >> $GITHUB_OUTPUT
          echo "message=❌ Build failed - Check logs for details" >> $GITHUB_OUTPUT
        else
          echo "status=success" >> $GITHUB_OUTPUT
          echo "message=✅ All checks passed successfully!" >> $GITHUB_OUTPUT
        fi
    
    - name: Build summary
      run: |
        echo "## 📊 Advanced CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Comprehensive Test | ${{ needs.comprehensive-test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Performance Test | ${{ needs.performance-test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Test | ${{ needs.integration-test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Documentation Check | ${{ needs.documentation-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build Validation | ${{ needs.build-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Overall Status**: ${{ steps.status.outputs.message }}" >> $GITHUB_STEP_SUMMARY
        
        echo "${{ steps.status.outputs.message }}"